<script>
    const toggle = document.getElementById('theme-toggle');
    const themeLink = document.getElementById('theme-link');

    // Load saved mode from localStorage
    if (localStorage.getItem('theme') === 'dark') {
      themeLink.href = 'pannellumdark.css';
    }

    toggle.addEventListener('click', () => {
      if (themeLink.getAttribute('href') === 'pannellum.css') {
        themeLink.href = 'pannellumdark.css';
        localStorage.setItem('theme', 'dark');
      } else {
        themeLink.href = 'pannellum.css';
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
<div>

<div id="panorama">
    <button id="tutorial-button" class="tutorial-button">Tutorial</button>
</div>

<div id="tutorial-popup">
    <h3>Tutorial</h3>
    <p>Welcome to the Great Wall of China Virtual Tour! This tutorial will guide you through the different features of this site.
    </p>
    <p> 1. You can open and close the popup by clicking the tutorial button.</p>

</div>

<script>
    const tutorialBtn = document.getElementById('tutorial-button');
    const popup = document.getElementById('tutorial-popup');
    var isOpen = false;

    tutorialBtn.onclick = () => {
        if (!isOpen) {
            popup.style.display = "block";
            isOpen = true;

        } else {
            popup.style.display = "none";
            isOpen = false;

        }

    };

</script>
