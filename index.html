<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skibidi</title>
    <link rel="stylesheet" href="pannellum.css"/>
    <script type="text/javascript" src="pannellum.js"></script>
    <style>
    #panorama {
        width: 600px;
        height: 400px;
    }
    </style>
</head>
<body>


<div id="panorama"></div>
<script>
pannellum.viewer('panorama', {   
    "default": {
        "firstScene": "gwoc1",
        "sceneFadeDuration": 1000
    },
    "hotSpotDebug": true,
    "scenes": {
        "gwoc1": {
            "hfov": 110,
            "type": "equirectangular",
            "panorama": "sites/gwoc1.jpg",
            "autoRotate": 2,
            "compass": false,
            "hotSpots": [
                {
                    "pitch": -2.1,
                    "yaw": 132.9,
                    "type": "scene",
                    "text": "",
                    "sceneId": "gwoc2"
                }
            ]
        },

        "gwoc2": {
            "hfov": 110,
            "type": "equirectangular",
            "panorama": "sites/gwoc2.jpg",
            "autoRotate": -2,
            "compass": false,
            "hotSpots": [
                {
                    "pitch": -0.6,
                    "yaw": 37.1,
                    "type": "scene",
                    "text": "",
                    "sceneId": "gwoc1",
                    "targetYaw": -23,
                    "targetPitch": 2
                }
            ]
        }
    }
});
</script>


</body>
</html>
